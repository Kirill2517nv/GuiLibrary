<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция</title>
    <style>
        /* Размер канваса задаёт не CSS, а сама программа: gui_main_loop() каждый
           кадр вызывает glfwSetWindowSize(window.innerWidth, window.innerHeight).
           Внутри iframe innerWidth – это размер самого iframe, поэтому канвас
           подстраивается под контейнер сам. Здесь остаётся только убрать поля
           и полосы прокрутки, чтобы он не считал их своим местом. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #1e293b;               /* slate-800 – фон сайта в тёмной теме */
            font: 14px/1.5 Inter, system-ui, sans-serif;
            color: #cbd5e1;
        }
        body.theme-light { background: #f1f5f9; color: #475569; }
        canvas#canvas { display: block; }

        /* Экран загрузки. Виден до старта wasm: файл весит больше мегабайта,
           и без него страница минуту выглядит сломанным чёрным прямоугольником. */
        #boot {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            background: inherit; z-index: 10;
        }
        #boot.hidden { display: none; }
        #boot-spinner {
            width: 34px; height: 34px; border-radius: 50%;
            border: 3px solid currentColor; border-top-color: transparent;
            opacity: .45; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #boot-spinner { animation: none; } }
        #boot-text { font-size: 13px; opacity: .75; }
        #boot.failed #boot-spinner { display: none; }
        #boot.failed #boot-text { color: #f87171; max-width: 32rem; text-align: center; padding: 0 1rem; }

        /* Полоса сообщений программы. Библиотека пишет предупреждения в stderr
           («параметр не найден», «график не найден»), а в браузере stderr – это
           консоль разработчика, куда школьник не заглядывает. Полоса появляется
           только когда программе есть что сказать. */
        #log {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
            display: none; max-height: 30%; overflow-y: auto;
            padding: 8px 12px; background: rgba(127, 29, 29, .94); color: #fee2e2;
            font-family: ui-monospace, Consolas, monospace; font-size: 12px;
            white-space: pre-wrap; word-break: break-word;
        }
        #log.shown { display: block; }
        #log-close {
            position: sticky; top: 0; float: right;
            background: none; border: none; color: inherit;
            font-size: 16px; line-height: 1; cursor: pointer; opacity: .7;
        }
        #log-close:hover { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="boot">
        <div id="boot-spinner"></div>
        <div id="boot-text">Загрузка симуляции…</div>
    </div>

    <div id="log"><button id="log-close" title="Скрыть">&times;</button><span id="log-text"></span></div>

    <script>
        (function () {
            var boot = document.getElementById('boot');
            var bootText = document.getElementById('boot-text');
            var log = document.getElementById('log');
            var logText = document.getElementById('log-text');

            // Тему выбирает встраивающая страница: ?theme=light. Влияет только на
            // фон вокруг канваса и экран загрузки – сам ImGui рисуется тёмным
            // (StyleColorsDark в init_gui_library).
            if (new URLSearchParams(location.search).get('theme') === 'light') {
                document.body.classList.add('theme-light');
            }

            document.getElementById('log-close').onclick = function () {
                log.classList.remove('shown');
            };

            window.Module = {
                canvas: document.getElementById('canvas'),

                // Emscripten зовёт setStatus('Running...'), затем setStatus('')
                // когда программа стартовала. Пустая строка – сигнал убрать заставку.
                setStatus: function (text) {
                    if (!text) { boot.classList.add('hidden'); return; }
                    bootText.textContent = text;
                },
                onRuntimeInitialized: function () { boot.classList.add('hidden'); },

                printErr: function (text) {
                    console.error(text);
                    logText.textContent += text + '\n';
                    log.classList.add('shown');
                },
                onAbort: function (what) {
                    boot.classList.remove('hidden');
                    boot.classList.add('failed');
                    bootText.textContent = 'Симуляция не запустилась: ' + what;
                }
            };
        })();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
